name: Mobile

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VLAINA_ANDROID_VERSION_CODE: ${{ github.run_number }}
      VLAINA_ANDROID_STORE_PASSWORD: ${{ secrets.VLAINA_ANDROID_STORE_PASSWORD }}
      VLAINA_ANDROID_KEY_ALIAS: ${{ secrets.VLAINA_ANDROID_KEY_ALIAS }}
      VLAINA_ANDROID_KEY_PASSWORD: ${{ secrets.VLAINA_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve mobile version
        shell: bash
        run: echo "VLAINA_ANDROID_VERSION_NAME=$(node -p \"require('./mobile/package.json').version\")" >> "$GITHUB_ENV"

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VLAINA_ANDROID_KEYSTORE_BASE64: ${{ secrets.VLAINA_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$VLAINA_ANDROID_KEYSTORE_BASE64"
          test -n "$VLAINA_ANDROID_STORE_PASSWORD"
          test -n "$VLAINA_ANDROID_KEY_ALIAS"
          test -n "$VLAINA_ANDROID_KEY_PASSWORD"
          echo "$VLAINA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vlaina-upload.jks"
          echo "VLAINA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vlaina-upload.jks" >> "$GITHUB_ENV"

      - name: Test mobile web app
        run: pnpm --dir mobile test

      - name: Build and sync Android
        run: |
          pnpm --dir mobile build
          pnpm --dir mobile exec cap sync android

      - name: Build Android release
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest lintRelease bundleRelease --no-daemon

      - name: Verify signed release bundle
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: mobile/android
        run: jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android bundle and lint report
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-android-run-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/reports/lint-results-release.html
          if-no-files-found: error

  android-instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and sync Android
        run: |
          pnpm --dir mobile build
          pnpm --dir mobile exec cap sync android

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: cd mobile/android && ./gradlew connectedDebugAndroidTest --no-daemon

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and sync iOS
        run: |
          pnpm --dir mobile build
          pnpm --dir mobile exec cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
