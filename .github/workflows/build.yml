name: Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish, for example 0.1.0. A leading v is optional."
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  release-context:
    name: Resolve release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ "$IS_RELEASE" != "true" ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${RELEASE_INPUT#"${RELEASE_INPUT%%[![:space:]]*}"}"
          version="${version%"${version##*[![:space:]]}"}"
          version="${version#[vV]}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported app version: $RELEASE_INPUT" >&2
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v6

      - name: Verify package version matches tag
        if: steps.release.outputs.tag != ''
        run: node scripts/verify-version-from-tag.mjs "${{ steps.release.outputs.tag }}"

  typecheck:
    name: Checks / Typecheck
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        run: pnpm typecheck

  dependency-audit:
    name: Security / Production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Audit production dependencies
        run: pnpm run quality:security

  secret-scan:
    name: Security / Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - typecheck
      - dependency-audit
      - secret-scan
      - build
    if: always()

    permissions:
      contents: read

    steps:
      - name: Require all checks to pass
        shell: bash
        run: |
          build_result="${{ needs.build.result }}"
          if [[ "${{ needs.typecheck.result }}" != "success" || "${{ needs.dependency-audit.result }}" != "success" || "${{ needs.secret-scan.result }}" != "success" || ( "$build_result" != "success" && "$build_result" != "skipped" ) ]]; then
            echo "Typecheck: ${{ needs.typecheck.result }}" >&2
            echo "Dependency audit: ${{ needs.dependency-audit.result }}" >&2
            echo "Secret scan: ${{ needs.secret-scan.result }}" >&2
            echo "Build: $build_result" >&2
            exit 1
          fi

  build:
    if: github.event_name == 'pull_request'
    name: Build renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release-context

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build renderer
        run: pnpm exec vite build

      - name: Cache renderer build output
        uses: actions/cache/save@v5
        with:
          path: dist
          key: renderer-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  package:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: release-context

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            label: windows-x64
            platform: windows
            arch: x64
            target: --win --x64
          - os: windows-2025-vs2026
            label: windows-arm64
            platform: windows
            arch: arm64
            target: --win --arm64
          - os: macos-15-intel
            label: macos-x64
            platform: macos
            arch: x64
            target: --mac --x64
          - os: macos-15
            label: macos-arm64
            platform: macos
            arch: arm64
            target: --mac --arm64
          - os: ubuntu-24.04
            label: linux-x64
            platform: linux
            arch: x64
            target: --linux --x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            platform: linux
            arch: arm64
            target: --linux --arm64

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install ImageMagick on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install ImageMagick on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }

      - name: Generate desktop icons
        run: pnpm run prepare:desktop-assets

      - name: Build renderer
        run: pnpm exec vite build

      - name: Restore Electron build caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Package Electron app
        if: runner.os != 'macOS'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never

      - name: Package Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: pnpm exec electron-builder --config electron-builder.yml --win appx --x64 --publish never

      - name: Sign Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path 'release/*.msix' -File | Select-Object -First 1
          if ($null -eq $package) { throw 'Microsoft Store MSIX was not found.' }
          ./scripts/sign-microsoft-store-package.ps1 -PackagePath $package.FullName

      - name: Package Electron app
        if: runner.os == 'macOS'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi

            echo "macOS packaging failed on attempt $attempt; cleaning up mounted DMG volumes before retry."
            while read -r device; do
              if [[ -n "$device" ]]; then
                hdiutil detach -force "$device" || true
              fi
            done < <(hdiutil info | awk '/\/Volumes\/vlaina/{print $1}')
            rm -rf release
            sleep 10
          done

      - name: Smoke test Windows installer launch
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem -Path 'release/*-windows-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows x64 installer was not found.'
          }
          ./scripts/windows-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Upload Windows NSIS installer
        if: success() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-windows-nsis-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable app
        if: success() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-windows-portable-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-windows-${{ matrix.arch }}-portable.exe
          if-no-files-found: error

      - name: Upload Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-microsoft-store-msix-run-${{ github.run_number }}
          path: release/*.msix
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload macOS DMG
        if: success() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-macos-dmg-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        if: success() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-macos-zip-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-appimage-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.AppImage
          if-no-files-found: error

      - name: Upload Linux DEB
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-deb-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.deb
          if-no-files-found: error

      - name: Upload Linux tar.gz
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-tar-gz-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.tar.gz
          if-no-files-found: error

  package-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - checks
      - release-context

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            label: windows-x64
            platform: windows
            arch: x64
            target: --win --x64
          - os: windows-2025-vs2026
            label: windows-arm64
            platform: windows
            arch: arm64
            target: --win --arm64
          - os: macos-15-intel
            label: macos-x64
            platform: macos
            arch: x64
            target: --mac --x64
          - os: macos-15
            label: macos-arm64
            platform: macos
            arch: arm64
            target: --mac --arm64
          - os: ubuntu-24.04
            label: linux-x64
            platform: linux
            arch: x64
            target: --linux --x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            platform: linux
            arch: arm64
            target: --linux --arm64

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install ImageMagick on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install ImageMagick on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }

      - name: Generate desktop icons
        run: pnpm run prepare:desktop-assets

      - name: Build renderer
        run: pnpm exec vite build

      - name: Restore Electron build caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Package Electron app
        if: runner.os != 'macOS'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never

      - name: Package Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        run: pnpm exec electron-builder --config electron-builder.yml --win appx --x64 --publish never

      - name: Sign Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path 'release/*.msix' -File | Select-Object -First 1
          if ($null -eq $package) { throw 'Microsoft Store MSIX was not found.' }
          ./scripts/sign-microsoft-store-package.ps1 -PackagePath $package.FullName

      - name: Package Electron app
        if: runner.os == 'macOS'
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi

            echo "macOS packaging failed on attempt $attempt; cleaning up mounted DMG volumes before retry."
            while read -r device; do
              if [[ -n "$device" ]]; then
                hdiutil detach -force "$device" || true
              fi
            done < <(hdiutil info | awk '/\/Volumes\/vlaina/{print $1}')
            rm -rf release
            sleep 10
          done

      - name: Smoke test Windows installer launch
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem -Path 'release/*-windows-x64-setup.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows x64 installer was not found.'
          }
          ./scripts/windows-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Upload Windows NSIS installer
        if: success() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-windows-nsis-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

      - name: Upload Windows portable app
        if: success() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-windows-portable-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-windows-${{ matrix.arch }}-portable.exe
          if-no-files-found: error

      - name: Upload Microsoft Store MSIX
        if: success() && matrix.platform == 'windows' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-microsoft-store-msix-${{ needs.release-context.outputs.tag }}
          path: release/*.msix
          if-no-files-found: error
          retention-days: 90
          archive: false

      - name: Upload macOS DMG
        if: success() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-macos-dmg-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        if: success() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-macos-zip-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-appimage-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.AppImage
          if-no-files-found: error

      - name: Upload Linux DEB
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-deb-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.deb
          if-no-files-found: error

      - name: Upload Linux tar.gz
        if: success() && matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: vlaina-linux-tar-gz-${{ matrix.arch }}-run-${{ github.run_number }}
          path: release/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - checks
      - package-release
      - release-context
    concurrency:
      group: publish-release-assets-${{ needs.release-context.outputs.tag }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vlaina-*-run-${{ github.run_number }}
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release-artifacts/*)

          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found." >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber; then
                exit 0
              fi
            else
              draft_id="$(
                gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
                  jq -r --arg tag "$RELEASE_TAG" '.[] | select(.draft and .tag_name == $tag) | .id' |
                  head -n 1
              )"
              if [[ -n "$draft_id" ]]; then
                echo "Removing incomplete draft release for $RELEASE_TAG before retrying."
                gh api --method DELETE "repos/$GH_REPO/releases/$draft_id"
              fi

              if gh release create "$RELEASE_TAG" "${artifacts[@]}" \
                --draft \
                --target "$GITHUB_SHA" \
                --title "vlaina $RELEASE_TAG" \
                --generate-notes \
                "${prerelease_args[@]}"; then
                draft_id="$(
                  gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
                    jq -r --arg tag "$RELEASE_TAG" '.[] | select(.draft and .tag_name == $tag) | .id' |
                    head -n 1
                )"
                if [[ -z "$draft_id" ]]; then
                  echo "Draft release for $RELEASE_TAG was not found after uploading assets." >&2
                  exit 1
                fi
                gh api --method PATCH "repos/$GH_REPO/releases/$draft_id" -F draft=false >/dev/null
                exit 0
              fi
            fi

            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi

            echo "Release publish failed on attempt $attempt; retrying."
            sleep $(( attempt * 20 ))
          done
