packages:
  - '.'
  - 'mobile'
  - 'mobile/plugins/*'
  - 'vendor/milkdown/packages/*'
  - 'vendor/milkdown/packages/plugins/*'
  - 'vendor/milkdown/packages/integrations/react'
overrides:
  '@codemirror/autocomplete': 6.20.1
  '@codemirror/commands': 6.10.3
  '@codemirror/language': 6.12.3
  '@codemirror/lint': 6.9.5
  '@codemirror/search': 6.6.0
  '@codemirror/view': 6.43.1
  'brace-expansion@1.1.15': 1.1.16
  'brace-expansion@2.1.1': 2.1.2
  'brace-expansion@5.0.6': 5.0.8
  dompurify: 3.4.12
  esbuild: 0.28.1
  fast-uri: 3.1.4
  js-yaml: 4.3.0
  katex: 0.17.0
  lodash-es: 4.18.1
  postcss: 8.5.23
  react: 19.2.7
  react-dom: 19.2.7
  tar: 7.5.22
onlyBuiltDependencies:
  - electron
  - esbuild
  - sharp
  - sharp
peerDependencyRules:
  allowedVersions:
    react: '^19.0.0'
supportedArchitectures:
  os:
    - current
    - linux
    - win32
  cpu:
    - current
    - x64
